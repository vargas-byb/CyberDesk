[package]
name = "cyberdesk"
version = "0.4.0"
edition = "2021"
description = "CyberDesk - catalogo animado de hardware para ciberseguranca, ESP32 e Arduino"
build = "build.rs"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
include_dir = "0.7"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Dependências otimizadas também no modo debug: Argon2 e o egui ficam rápidos
# nos testes e em `cargo run`, sem atrapalhar a depuração do código do app.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
