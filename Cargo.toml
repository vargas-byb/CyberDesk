[package]
name = "cyberdesk"
version = "0.2.0"
edition = "2021"
description = "CyberDesk - catalogo animado de hardware para ciberseguranca, ESP32 e Arduino"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
include_dir = "0.7"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
