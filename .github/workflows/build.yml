name: Build CyberDesk

on:
  push:
    branches: [main]
  # em Pull Requests só compila e testa (não publica Release)
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # gravado no .exe: o app compara com a última Release para avisar de atualização
      CYBERDESK_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --release

      - name: Compilar (release)
        run: cargo build --release

      - name: Preparar executavel
        run: Copy-Item target/release/cyberdesk.exe CyberDesk.exe

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CyberDesk-windows
          path: CyberDesk.exe

      # Toda versao nova que passa no build vira uma Release (v0.4.<numero do build>)
      - name: Publicar Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: CyberDesk v0.4.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: CyberDesk.exe
