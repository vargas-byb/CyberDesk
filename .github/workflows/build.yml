name: Build CyberDesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar (release)
        run: cargo build --release

      - name: Preparar executavel
        run: Copy-Item target/release/cyberdesk.exe CyberDesk.exe

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CyberDesk-windows
          path: CyberDesk.exe

      # Toda versao nova que passa no build vira uma Release (v0.2.<numero do build>)
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: CyberDesk v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: CyberDesk.exe
